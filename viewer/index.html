<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Pan Camera Viewer</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #dddbd4; --accent: #b4532a; --viewport: #e9e7e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9892;
      --line: #34332f; --accent: #e07a4b; --viewport: #1a1a18;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9892;
    --line: #34332f; --accent: #e07a4b; --viewport: #1a1a18;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 0 8px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .part { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--line); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .part small { color: var(--muted); display: block; font-size: 11px; }
  label { cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button { font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .viewport { position: relative; background: var(--viewport); min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted);
    background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 6px 10px; border-radius: 6px; }
  .axes { position: absolute; right: 12px; bottom: 12px; font-size: 12px; color: var(--muted); }
  .err { color: var(--accent); white-space: pre-wrap; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    aside { order: 2; border-right: none; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>X-Pan pinhole camera</h1>
      <div class="sub">65 x 24mm on 135 film. Built from cad/ with build123d.</div>
    </div>
    <section>
      <h2>Parts</h2>
      <div id="parts"></div>
    </section>
    <section>
      <h2>Section</h2>
      <div class="row">
        <select id="secAxis" aria-label="Section axis">
          <option value="off">Off</option>
          <option value="x">X (film travel)</option>
          <option value="y">Y (front / back)</option>
          <option value="z">Z (height)</option>
        </select>
        <button id="secFlip" title="Show the other side">Flip</button>
      </div>
      <input id="secPos" type="range" min="0" max="1000" value="500" aria-label="Section position">
      <div class="sub" id="secLabel">No section</div>
    </section>
    <section>
      <h2>Exploded view</h2>
      <input id="explode" type="range" min="0" max="100" value="0" aria-label="Explode">
    </section>
    <section>
      <h2>Mechanism</h2>
      <div class="btns"><button id="spin">Turn sprocket</button></div>
      <div class="sub" id="spinLabel"></div>
    </section>
    <section>
      <h2>View</h2>
      <div class="btns">
        <button data-view="iso">Iso</button>
        <button data-view="front">Front</button>
        <button data-view="rear">Rear</button>
        <button data-view="top">Top</button>
      </div>
    </section>
  </aside>
  <div class="viewport" id="viewport">
    <div class="hud" id="hud">Loading...</div>
    <div class="axes">X travel · Y front · Z up · grid 10mm</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MANIFEST = new URLSearchParams(location.search).get('manifest') || '../out/manifest.json';
const base = new URL(MANIFEST, location.href);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const viewport = document.getElementById('viewport');
const hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
viewport.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(-120, 200, 260);
scene.add(key);

const grid = new THREE.GridHelper(400, 40);
grid.rotation.x = Math.PI / 2;
grid.material.transparent = true;
grid.material.opacity = 0.25;
scene.add(grid);

// glTF is Y-up; rotate back so world coordinates equal camera-design coordinates in mm.
const root = new THREE.Group();
root.rotation.x = Math.PI / 2;
scene.add(root);

const parts = [];
const clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
let sceneBox = new THREE.Box3();
let spinning = false, spinAngle = 0, filmAdvance = 0;

function applyTheme() {
  scene.background = new THREE.Color(css('--viewport'));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();

function resize() {
  const { clientWidth: w, clientHeight: h } = viewport;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);

async function load() {
  const res = await fetch(base, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Cannot read ${base} (${res.status}). Run: uv run python cad/export.py`);
  const manifest = await res.json();
  const loader = new GLTFLoader();
  for (const spec of manifest.parts) {
    const gltf = await loader.loadAsync(`${new URL(spec.glb, base).href}?t=${Date.now()}`);
    const material = new THREE.MeshStandardMaterial({
      color: spec.color, metalness: 0.05, roughness: 0.55,
      side: THREE.FrontSide, clippingPlanes: [], clipShadows: true,
    });
    // Inside faces in a dark tone, so a section reads as a cut rather than a hollow shell.
    const inside = new THREE.MeshBasicMaterial({
      color: new THREE.Color(spec.color).multiplyScalar(0.35), side: THREE.BackSide, clippingPlanes: [],
    });
    const meshes = [];
    gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
    for (const m of meshes) {
      m.material = material;
      const back = new THREE.Mesh(m.geometry, inside);
      m.add(back);
    }
    const holder = new THREE.Group();   // explode offset
    const pivot = new THREE.Group();    // spin about the part's own axis
    holder.add(pivot);
    pivot.add(gltf.scene);
    root.add(holder);
    parts.push({ spec, holder, pivot, model: gltf.scene, material, inside, visible: true });
  }
  root.scale.setScalar(manifest.glb_unit_scale);
  filmAdvance = manifest.film_advance_mm;
  document.getElementById('spinLabel').textContent = `One full turn advances ${filmAdvance}mm of film.`;
  for (const p of parts) setupSpin(p);
  sceneBox = worldBox(root);
  buildPartList();
  setView('iso');
  updateSection();
  hud.textContent = `${parts.length} part${parts.length === 1 ? '' : 's'} loaded`;
  window.viewerState = { parts: parts.map(p => p.spec.name), box: sceneBox.clone() };
}

function worldBox(object) {
  // Box3.setFromObject does not refresh child matrices, so update the whole tree first.
  root.updateMatrixWorld(true);
  return new THREE.Box3().setFromObject(object);
}

function setupSpin(p) {
  const axis = p.spec.spin_axis_xy;
  if (!axis) return;
  // Root space is glTF (Y-up, file units): camera (x, y, z) mm -> (x, z, -y) / scale.
  const offset = new THREE.Vector3(axis[0], 0, -axis[1]).divideScalar(root.scale.x);
  p.pivot.position.copy(offset);
  p.model.position.copy(offset).negate();
  p.spinAxis = new THREE.Vector3(0, 1, 0);
}

function buildPartList() {
  const list = document.getElementById('parts');
  list.innerHTML = '';
  for (const p of parts) {
    const row = document.createElement('div');
    row.className = 'part';
    const [x, y, z] = p.spec.size_mm;
    row.innerHTML = `<span class="swatch" style="background:${p.spec.color}"></span>
      <label><input type="checkbox" checked> ${p.spec.name}
      <small>${x} x ${y} x ${z}mm · ${(p.spec.volume_mm3 / 1000).toFixed(1)} cm³</small></label>
      <button title="See through">Ghost</button>`;
    row.querySelector('input').addEventListener('change', e => { p.holder.visible = e.target.checked; });
    const ghost = row.querySelector('button');
    ghost.addEventListener('click', () => {
      const on = !ghost.classList.contains('on');
      ghost.classList.toggle('on', on);
      for (const m of [p.material, p.inside]) {
        m.transparent = on;
        m.opacity = on ? 0.25 : 1;
        m.depthWrite = !on;
      }
    });
    list.appendChild(row);
  }
}

function setView(name) {
  const c = sceneBox.getCenter(new THREE.Vector3());
  const r = sceneBox.getSize(new THREE.Vector3()).length() * 1.4 + 20;
  const dirs = {
    iso: [-0.55, 0.75, 0.45], front: [0, 1, 0.0001], rear: [0, -1, 0.0001], top: [0.0001, 0.0001, 1],
  };
  const d = new THREE.Vector3(...dirs[name]).normalize();
  camera.position.copy(c).addScaledVector(d, r);
  controls.target.copy(c);
  controls.update();
}

function updateSection() {
  const axis = document.getElementById('secAxis').value;
  const t = document.getElementById('secPos').value / 1000;
  const flip = document.getElementById('secFlip').classList.contains('on') ? -1 : 1;
  const label = document.getElementById('secLabel');
  const planes = axis === 'off' ? [] : [clipPlane];
  if (axis !== 'off') {
    const lo = sceneBox.min[axis], hi = sceneBox.max[axis];
    const pos = lo + (hi - lo) * t;
    const n = new THREE.Vector3(axis === 'x' ? -1 : 0, axis === 'y' ? -1 : 0, axis === 'z' ? -1 : 0).multiplyScalar(flip);
    clipPlane.set(n, flip * pos);
    label.textContent = `${axis.toUpperCase()} = ${pos.toFixed(2)}mm`;
  } else {
    label.textContent = 'No section';
  }
  for (const p of parts) {
    for (const m of [p.material, p.inside]) { m.clippingPlanes = planes; m.needsUpdate = true; }
  }
}

function updateExplode() {
  const k = document.getElementById('explode').value / 100;
  const centre = sceneBox.getCenter(new THREE.Vector3());
  for (const p of parts) {
    const box = worldBox(p.model);
    const dir = box.getCenter(new THREE.Vector3()).sub(centre);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
    const worldOffset = dir.normalize().multiplyScalar(k * 60);
    // holder lives in root space; convert the world offset into it.
    p.holder.position.copy(worldOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2).divideScalar(root.scale.x));
  }
}

document.getElementById('secAxis').addEventListener('change', updateSection);
document.getElementById('secPos').addEventListener('input', updateSection);
document.getElementById('secFlip').addEventListener('click', e => { e.target.classList.toggle('on'); updateSection(); });
document.getElementById('explode').addEventListener('input', updateExplode);
document.getElementById('spin').addEventListener('click', e => {
  spinning = !spinning;
  e.target.classList.toggle('on', spinning);
});
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (spinning) {
    spinAngle += dt * Math.PI / 2;
    for (const p of parts) if (p.spinAxis) p.pivot.setRotationFromAxisAngle(p.spinAxis, spinAngle);
    const turns = spinAngle / (2 * Math.PI);
    document.getElementById('spinLabel').textContent = `${turns.toFixed(2)} turns = ${(turns * filmAdvance).toFixed(1)}mm of film`;
  }
  controls.update();
  renderer.render(scene, camera);
});

resize();
load().catch(err => { hud.innerHTML = `<span class="err">${err.message}</span>`; console.error(err); });
</script>
</body>
</html>
